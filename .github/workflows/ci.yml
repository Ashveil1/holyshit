name: ci
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: full suites incl. kernel on QEMU + benchmarks
  workflow_dispatch:

jobs:
  hsml-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: bounded learning, persistence and uncertainty regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 ai/wnn/test_learning.py
          python3 ai/wnn/test_adversarial.py
          python3 ai/wnn/test_revision.py
          python3 ai/wnn/test_review_findings.py
          python3 ai/wnn/test_failed_resume.py
          python3 ai/wnn/profile_latency.py
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: native backend deps (gcc + Boehm GC)
        run: sudo apt-get update && sudo apt-get install -y gcc libgc-dev qemu-user
      - name: tests write scratch files under /tmp/opencode
        run: mkdir -p /tmp/opencode
      - name: all suites except the QEMU kernel suite
        run: python3 tests/run_all.py --quick

  # Supported arm64 slice is a required job on PR/push/dispatch. Keep the
  # broad legacy/x86 sweep below informational rather than hiding failures
  # of the now-supported compiler/interpreter gates behind continue-on-error.
  arm64-port:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: mkdir -p /tmp/opencode && uname -m
      - name: hs compiler AArch64 image and native execution oracle
        run: python3 tests/test_a64compiler.py
      - name: hs interpreter native parity
        run: python3 tests/test_irinterp.py
      - name: hs interpreter bounded profiling
        run: python3 tests/test_irprofile_hs.py
      - name: AArch64 assembler native execution
        run: python3 tests/test_arm64_asm.py
      - name: pinned AArch64 runtime corpus
        run: python3 tests/arm64_corpus.py

  # Discovery lane for the arm64 port: which suites already pass on a real
  # arm64 host. Informational (continue-on-error): remaining legacy/x86-only
  # suites are outside the required arm64-port slice above.
  arm64:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: native backend deps (gcc + Boehm GC)
        run: sudo apt-get update && sudo apt-get install -y gcc libgc-dev
      - run: mkdir -p /tmp/opencode && uname -m
      - name: quick suites on arm64 (informational)
        run: python3 tests/run_all.py --quick

  full:
    env:
      # Test BIOS GRUB only, independent of preinstalled EFI modules/tools.
      HS_TEST_GRUB_DIR: /usr/lib/grub/i386-pc
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y gcc libgc-dev qemu-system-x86 qemu-user grub-pc-bin grub-common xorriso
      - run: mkdir -p /tmp/opencode
      - name: fixed framebuffer console boot and cursor boundaries (required)
        run: HS_REQUIRE_GUI=1 HS_GUI_EVIDENCE=${{ runner.temp }}/hs-gui-evidence python3 tests/test_console_fixed.py
      - name: separate command console help/echo and actual result pixels (required)
        run: HS_REQUIRE_GUI=1 HS_GUI_EVIDENCE=${{ runner.temp }}/hs-command-evidence python3 tests/test_command_console.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: framebuffer-boot-evidence
          path: |
            ${{ runner.temp }}/hs-gui-evidence
            ${{ runner.temp }}/hs-command-evidence
      - name: every suite including xkernel on QEMU
        run: python3 tests/run_all.py
      - name: benchmarks vs CPython
        run: python3 bench/run.py | tee bench-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench-result.txt
