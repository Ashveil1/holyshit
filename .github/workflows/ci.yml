name: ci
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: full suites incl. kernel on QEMU + benchmarks
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: native backend deps (gcc + Boehm GC)
        run: sudo apt-get update && sudo apt-get install -y gcc libgc-dev qemu-user
      - name: tests write scratch files under /tmp/opencode
        run: mkdir -p /tmp/opencode
      - name: all suites except the QEMU kernel suite
        run: python3 tests/run_all.py --quick

  # Discovery lane for the arm64 port: which suites already pass on a real
  # arm64 host. Informational (continue-on-error) until the arm64 backend lands
  # and the passing set is pinned.
  arm64:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: native backend deps (gcc + Boehm GC)
        run: sudo apt-get update && sudo apt-get install -y gcc libgc-dev
      - run: mkdir -p /tmp/opencode && uname -m
      - name: hs interpreter tier native arm64 parity
        run: python3 tests/test_irinterp.py
      - name: hs compiler AArch64 target (native execution + image oracle)
        run: python3 tests/test_a64compiler.py
      - name: quick suites on arm64 (informational)
        run: python3 tests/run_all.py --quick

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y gcc libgc-dev qemu-system-x86 qemu-user
      - run: mkdir -p /tmp/opencode
      - name: every suite including xkernel on QEMU
        run: python3 tests/run_all.py
      - name: benchmarks vs CPython
        run: python3 bench/run.py | tee bench-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench-result.txt
